<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Login - Aquatic Sustainability</title>
        <link rel="icon" href="/favicon.ico" />
        <link rel="stylesheet" href="/static/css/styles.css" />
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    </head>
    <body class="login-page-body">
          <!-- Surface ripple layers -->
        <div class="water-ripple"></div>
        <div class="water-ripple2"></div>

        <!-- Top light glint -->
        <div class="water-glint"></div>
        
        <div data-navbar-root></div>

        <main class="container narrow">
            <section class="login-container">
                <div class="login-card">
                    <h1>Sign In</h1>
                    <p class="muted">Access your Aquatic Sustainability dashboard</p>

                    <form id="loginForm" class="login-form">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="text" id="email" name="email" required autocomplete="email" />
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" required autocomplete="current-password" />
                        </div>

                        <div id="errorMessage" class="error-message" style="display: none;"></div>

                        <button type="submit" class="btn btn-primary" id="loginBtn">
                            <span id="loginBtnText">Sign In</span>
                            <span id="loginBtnSpinner" style="display: none;">Signing in...</span>
                        </button>
                    </form>

                    <div class="oauth-divider">
                        <span>or continue with</span>
                    </div>

                    <button type="button" class="btn-google" id="googleLoginBtn">
                        <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        Sign in with Google
                    </button>

                    <button type="submit" class="btn btn-primary" id="skipBtn">
                        <span id="loginBtnText">Skip Login</span>
                    </button>

                    <p class="login-footer">
                    Don't have an account? <a href="/register">Register here</a>
                    </p>
                </div>
            </section>
        </main>

        <footer class="site-footer">
            <small>© <span id="year"></span> Aquatic Sustainability · UN SDG 6: Clean Water & Sanitation</small>
        </footer>

    <script src="/static/js/components/navbar.js" defer></script>
    <script src="/static/js/main.js" defer></script>
    <script src="/static/js/login.js" defer></script>
    <script src="/static/js/auth-google.js" defer></script>
    </body>
</html>

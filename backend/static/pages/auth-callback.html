<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Signing you in… - Aquatic Sustainability</title>
        <link rel="icon" href="/favicon.ico" />
        <link rel="stylesheet" href="/static/css/styles.css" />
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <style>
            body {
                margin: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                font-family: 'Inter', system-ui, sans-serif;
                background: linear-gradient(135deg, #004e7c 0%, #0077b6 50%, #00a7d3 100%);
            }
            .callback-card {
                background: rgba(255,255,255,0.95);
                border-radius: 20px;
                padding: 48px 40px;
                text-align: center;
                box-shadow: 0 20px 60px rgba(0,0,0,0.2);
                max-width: 400px;
                width: 90%;
            }
            .spinner {
                width: 48px;
                height: 48px;
                border: 4px solid #e2e8f0;
                border-top-color: #0ea5e9;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
                margin: 0 auto 24px;
            }
            @keyframes spin { to { transform: rotate(360deg); } }
            h2 { color: #1e3a8a; margin: 0 0 8px; font-size: 1.4rem; }
            p { color: #64748b; margin: 0; font-size: 0.95rem; }
            .error-box {
                display: none;
                background: #fee2e2;
                color: #dc2626;
                border-radius: 10px;
                padding: 14px;
                margin-top: 20px;
                font-size: 0.9rem;
            }
        </style>
    </head>
    <body>
        <div class="callback-card">
            <div class="spinner" id="spinner"></div>
            <h2 id="statusTitle">Completing sign-in…</h2>
            <p id="statusMsg">Please wait while we securely sign you in.</p>
            <div class="error-box" id="errorBox"></div>
        </div>

        <script>
        (async () => {
            const titleEl  = document.getElementById("statusTitle");
            const msgEl    = document.getElementById("statusMsg");
            const spinEl   = document.getElementById("spinner");
            const errorBox = document.getElementById("errorBox");

            function showError(msg) {
                spinEl.style.display = "none";
                titleEl.textContent = "Sign-in failed";
                msgEl.textContent   = "You can close this tab and try again.";
                errorBox.style.display = "block";
                errorBox.textContent   = msg;
            }

            // ── Load Supabase config from backend ──────────────────────────────
            let supabaseUrl = "";
            let supabaseAnonKey = "";
            try {
                const res = await fetch("/api/config/supabase");
                if (res.ok) {
                    const cfg = await res.json();
                    supabaseUrl    = cfg.supabaseUrl    || "";
                    supabaseAnonKey = cfg.supabaseAnonKey || "";
                }
            } catch (e) {
                showError("Could not reach authentication service.");
                return;
            }

            if (!supabaseUrl || !supabaseAnonKey) {
                showError("Authentication service not configured.");
                return;
            }

            const { createClient } = window.supabase;
            const sb = createClient(supabaseUrl, supabaseAnonKey);

            // ── Exchange the hash / query params for a session ─────────────────
            // Supabase v2 automatically handles the code/token in the URL.
            const { data, error } = await sb.auth.getSession();

            if (error || !data.session) {
                // Try exchanging the code explicitly (PKCE flow)
                const url = new URL(window.location.href);
                const code = url.searchParams.get("code");
                if (code) {
                    const { data: d2, error: e2 } = await sb.auth.exchangeCodeForSession(code);
                    if (e2 || !d2.session) {
                        showError(e2?.message || "No session returned from provider.");
                        return;
                    }
                    // Store token and redirect
                    localStorage.setItem("access_token",  d2.session.access_token);
                    localStorage.setItem("refresh_token", d2.session.refresh_token);
                    window.location.replace("/");
                    return;
                }
                showError(error?.message || "Authentication did not complete.");
                return;
            }

            // Session retrieved — store tokens and go home
            localStorage.setItem("access_token",  data.session.access_token);
            localStorage.setItem("refresh_token", data.session.refresh_token);
            titleEl.textContent = "Success! Redirecting…";
            msgEl.textContent   = "You are now signed in.";
            setTimeout(() => window.location.replace("/"), 800);
        })();
        </script>
    </body>
</html>
